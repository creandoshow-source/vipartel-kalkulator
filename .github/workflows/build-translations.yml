name: Build translations offline
on:
  push:
    paths:
      - '.github/workflows/build-translations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install argostranslate
      - name: Build all translations from local language models
        run: |
          cat > /tmp/t.py <<'PY'
          import json,base64,gzip
          from argostranslate import package, translate
          p=open('services-data.js',encoding='utf8').read()
          raw=gzip.decompress(base64.b64decode(p.split('"')[1])).decode('utf8')
          data=json.loads(raw[raw.index('=')+1:raw.rindex(';')])
          assert len(data)==127
          fields=['name','category','description','meta','unit']
          texts=[]
          for x in data:
              for f in fields:
                  v=x.get(f)
                  if v and v not in texts: texts.append(v)
          package.update_package_index()
          pkgs=package.get_available_packages()
          def install(a,b):
              q=next((x for x in pkgs if x.from_code==a and x.to_code==b),None)
              if not q: raise RuntimeError('Missing model '+a+'-'+b)
              package.install_from_path(q.download())
          install('pl','en')
          for code in ['de','fr','ru','uk']:
              install('en',code)
          english={t:translate.translate(t,'pl','en') for t in texts}
          out={'en':english}
          for code in ['de','fr','ru','uk']:
              out[code]={t:translate.translate(english[t],'en',code) for t in texts}
          assert set(out)=={'en','de','fr','ru','uk'}
          assert all(len(v)==len(texts) for v in out.values())
          for code,m in out.items():
              bad=sum(1 for a,b in m.items() if a==b and len(a)>8)
              assert bad < max(20,len(texts)//8),(code,bad)
          open('translations.js','w',encoding='utf8').write('window.VIPARTEL_TRANSLATIONS='+json.dumps(out,ensure_ascii=False,separators=(',',':'))+';')
          print('verified',len(data),'services',len(texts),'source strings',len(out),'languages')
          PY
          python /tmp/t.py
      - name: Commit verified translations
        run: |
          git config user.name "VIPARTEL Bot"
          git config user.email "actions@users.noreply.github.com"
          git add translations.js
          git commit -m "Complete verified translations for 127 services in 5 languages" || exit 0
          git push
