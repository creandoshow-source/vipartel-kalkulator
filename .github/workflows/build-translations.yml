name: Build translations final
on:
  push:
    paths:
      - '.github/workflows/build-translations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install deep-translator
      - name: Translate and verify full catalog
        run: |
          cat > /tmp/t.py <<'PY'
          import json,time,base64,gzip
          from deep_translator import GoogleTranslator
          p=open('services-data.js',encoding='utf8').read()
          b64=p.split('"')[1]
          s=gzip.decompress(base64.b64decode(b64)).decode('utf8')
          data=json.loads(s[s.index('=')+1:s.rindex(';')])
          assert len(data)==127
          fields=['name','category','description','meta','unit']
          texts=[]
          for x in data:
              for f in fields:
                  v=x.get(f)
                  if v and v not in texts: texts.append(v)
          out={}
          for lang in ['en','de','fr','ru','uk']:
              tr=GoogleTranslator(source='pl',target=lang)
              m={}
              for i in range(0,len(texts),8):
                  batch=texts[i:i+8]
                  try:
                      vals=tr.translate_batch(batch)
                  except Exception:
                      vals=[]
                      for t in batch:
                          try: vals.append(tr.translate(t))
                          except Exception: vals.append(t)
                  for a,b in zip(batch,vals): m[a]=b or a
                  time.sleep(0.2)
              out[lang]=m
          assert all(len(out[k])==len(texts) for k in out)
          open('translations.js','w',encoding='utf8').write('window.VIPARTEL_TRANSLATIONS='+json.dumps(out,ensure_ascii=False,separators=(',',':'))+';')
          print('services',len(data),'source strings',len(texts),'languages',len(out))
          PY
          python /tmp/t.py
      - name: Commit translations
        run: |
          git config user.name "VIPARTEL Bot"
          git config user.email "actions@users.noreply.github.com"
          git add translations.js
          git commit -m "Complete translations for all 127 services and 5 languages" || exit 0
          git push
