<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#78be20"><title>VIPARTEL Calculator</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=15"></head><body><div class="app"><header class="header"><div><h1>VIPARTEL · Calculator</h1><p>Wybierz dział albo zacznij wpisywać nazwę lub kod usługi.</p></div><button class="settings-btn" id="settingsBtn" aria-label="Ustawienia">⚙</button></header><main class="grid"><section><div class="card catalog"><div class="search-wrap"><input id="search" class="search" type="search" placeholder="Szukaj usługi..." autocomplete="off"><button id="backBtn" class="back" hidden>← Wszystkie działy</button></div><div id="viewTitle" class="view-title"></div><div id="categories" class="categories"></div><div id="results" class="results"></div><div id="status" class="status"></div></div></section><aside class="card side"><h2>Kalkulacja</h2><div id="cart"></div><div class="summary"><div class="sumline"><span>Suma netto</span><strong id="net">0,00 zł</strong></div><div class="vat-row"><label for="vat">VAT %</label><input id="vat" class="vat" type="number" min="0" max="100" step="1" value="0"></div><div class="sumline"><span>Kwota VAT</span><strong id="vatAmount">0,00 zł</strong></div><div class="total"><span>RAZEM</span><span id="gross">0,00 zł</span></div><div class="toolbar"><button class="btn btn-secondary" id="customBtn">+ Własna pozycja</button><button class="btn btn-secondary" id="clearBtn">Wyczyść</button></div><div id="customForm" class="custom-form"><input id="customName" placeholder="Nazwa"><input id="customPrice" type="number" step="0.01" min="0" placeholder="Cena"><button class="btn btn-add" id="customAdd">Dodaj</button></div></div></aside></main></div><div id="modalBg" class="modal-bg"><div class="modal"><button class="close" id="closeModal">Zamknij</button><h3 id="modalTitle"></h3><div id="modalCode" class="small"></div><div id="modalDetails" class="info-grid"></div><p id="modalDescription"></p></div></div><div id="settingsBg" class="modal-bg"><div class="modal settings-modal"><button class="close" id="closeSettings">Zamknij</button><h3>Ustawienia</h3><label>Rozmiar tekstu<select id="fontSize"><option value="small">Mały</option><option value="normal">Standard</option><option value="large">Duży</option></select></label><label>Język<select id="language"><option value="pl">Polski</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="ru">Русский</option><option value="uk">Українська</option></select></label><div class="settings-note">Język zmienia interfejs, nazwy usług, działy, opisy i informacje katalogowe.</div></div></div><script src="services.js?v=15"></script><script src="details-1.js?v=15"></script><script src="services-data.js?v=15"></script><script src="core.js?v=15"></script><script src="translations.js?v=15"></script><script src="app.js?v=15"></script></body></html>
